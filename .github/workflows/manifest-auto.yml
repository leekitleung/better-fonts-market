name: auto-update-manifest

on:
  push:
    branches: [main]
    paths:
      - '**/*.ttf'
      - '**/*.otf'
      - '**/*.ttc'
      - '**/*.woff'
      - '**/*.woff2'
      - 'scripts/generate-manifest.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate manifest
        id: gen
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}".Split('/')[1]
          ./scripts/generate-manifest.ps1 `
            -RepoOwner "${{ github.repository_owner }}" `
            -RepoName $repo `
            -Branch "${{ github.ref_name }}" `
            -FontDir "." `
            -Output "manifest.json" `
            -ReleaseTag "fonts"

      - name: Upload large fonts to Release
        if: steps.gen.outputs.has_large_files == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "fonts"

          # 确保 Release 存在
          $exists = gh release view $tag 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release '$tag'..."
            gh release create $tag --title "Font Assets" --notes "Auto-managed large font files. Do not delete." --latest=false
          }

          # 获取已有 assets
          $existingRaw = gh release view $tag --json assets --jq ".assets[].name" 2>$null
          $existingAssets = @()
          if ($existingRaw) {
            $existingAssets = $existingRaw -split "`n" | Where-Object { $_ -ne '' }
          }

          $largeFiles = '${{ steps.gen.outputs.large_files }}' | ConvertFrom-Json
          $stagingDir = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          foreach ($item in $largeFiles) {
            if ($existingAssets -contains $item.assetName) {
              Write-Host "  [Skip] $($item.assetName) already exists"
              continue
            }
            # 复制为目标文件名再上传，确保 asset name 正确
            $dest = Join-Path $stagingDir $item.assetName
            Copy-Item -Path $item.path -Destination $dest -Force
            Write-Host "  [Upload] $($item.assetName)..."
            gh release upload $tag $dest --clobber
          }

      - name: Commit manifest if changed
        shell: pwsh
        run: |
          if (git diff --quiet -- manifest.json) {
            Write-Host "No manifest changes."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: auto-update manifest"
          git push
